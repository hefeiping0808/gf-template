apiVersion: apps/v1
kind: Deployment
metadata:
  name: template-single
  labels:
    app: template-single
spec:
  replicas: 1
  selector:
    matchLabels:
      app: template-single
  template:
    metadata:
      labels:
        app: template-single
    spec:
      containers:
        - name : main
          image: template-single
          imagePullPolicy: Always
          volumeMounts:
            - name: app-config
              mountPath: /app/config/config.yaml
              subPath: config.yaml
          ports:
            - name: http
              containerPort: 8000
      volumes:
        - name: app-config
          configMap:
            name: template-single-configmap
