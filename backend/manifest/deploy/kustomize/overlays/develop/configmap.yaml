apiVersion: v1
kind: ConfigMap
metadata:
  name: template-single-configmap
data:
  config.yaml: |
    # 更新时间：2026-10-13 01:47:37 CST
    # Kubernetes develop 环境配置；部署前替换连接口令和安全密钥占位值。
    server:
      address: ":8000"
      readTimeout: 0s
      writeTimeout: 0s
      idleTimeout: 60s
      maxHeaderBytes: 20480
      keepAlive: true
      errorStack: false
      openapiPath: "/api.json"
      swaggerPath: "/swagger"
    logger:
      level: "all"
      stdout: true
      path: ""
      timeFormat: "2006-01-02 15:04:05.000"
    request:
      maxBodyBytes: 8388608
    websocket:
      readLimitBytes: 1048576
    database:
      default:
        link: "mysql:YOUR_DB_USER:YOUR_DB_PASSWORD@tcp(mysql:3306)/YOUR_DB_NAME?charset=utf8mb4&parseTime=true&loc=Local"
        debug: false
        prefix: ""
        maxIdle: 10
        maxOpen: 100
        maxLifeTime: 30m
        maxIdleTime: 5m
        queryTimeout: 3s
        execTimeout: 5s
        tranTimeout: 30s
    redis:
      default:
        address: "redis:6379"
        user: ""
        pass: "YOUR_REDIS_PASSWORD"
        db: 0
        minIdle: 2
        maxIdle: 10
        maxActive: 100
        maxConnLifetime: 30s
        idleTimeout: 10s
        waitTimeout: 3s
        dialTimeout: 3s
        protocol: 3
    security:
      jwt:
        secret: "REPLACE_WITH_A_RANDOM_SECRET_AT_LEAST_32_BYTES"
        issuer: "gf-template"
        expireSeconds: 7200
        allowDemoIssue: false
      sm2:
        # 响应 data 使用公钥加密；请求 data 使用匹配私钥解密，均需 PEM 编码。
        publicKey: |-
          -----BEGIN PUBLIC KEY-----
          REPLACE_WITH_SM2_PUBLIC_KEY
          -----END PUBLIC KEY-----
        # 当前支持未加密 PKCS#8 格式（BEGIN PRIVATE KEY），密文按 Base64 C1C3C2 编码。
        privateKey: |-
          -----BEGIN PRIVATE KEY-----
          REPLACE_WITH_SM2_PKCS8_PRIVATE_KEY
          -----END PRIVATE KEY-----
      aes:
        # AES-GCM 数据密钥，建议使用随机 32 字节；占位值会被程序拒绝用于加解密。
        key: "REPLACE_WITH_32_BYTE_AES_SECRET!"
    features:
      rabbitmq:
        # true 时启动进程内有界队列（不是 RabbitMQ 服务）；任务不持久化，重启会丢失。
        enabled: true
        queueSize: 128
      search:
        enabled: true
        driver: "mysql"
      cos:
        # true 时使用本地目录存储，不连接腾讯云 COS。
        enabled: true
        localDir: "/app/storage"
